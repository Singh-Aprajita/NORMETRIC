services:
  - type: web
    name: normetric
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NORMETRIC_DATA_DIR
        value: /var/data
    disk:
      name: normetric-storage
      mountPath: /var/data
      sizeGB: 1
